<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./main.js"></script>
    <title>Frontend Mentor | Interactive rating component</title>
  </head>

  <body>
    <div class="container">
      <!-- Rating state start -->
      <section class="rating_state">
        <div aria-hidden="true" class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="16">
            <path
              d="m9.067.43 1.99 4.031c.112.228.33.386.58.422l4.45.647a.772.772 0 0 1 .427 1.316l-3.22 3.138a.773.773 0 0 0-.222.683l.76 4.431a.772.772 0 0 1-1.12.813l-3.98-2.092a.773.773 0 0 0-.718 0l-3.98 2.092a.772.772 0 0 1-1.119-.813l.76-4.431a.77.77 0 0 0-.222-.683L.233 6.846A.772.772 0 0 1 .661 5.53l4.449-.647a.772.772 0 0 0 .58-.422L7.68.43a.774.774 0 0 1 1.387 0Z"
              fill="#FC7614"
            />
          </svg>
        </div>
        <h1 class="header" id="rating-label">How did we do?</h1>
        <p class="details">
          Please let us know how we did with your support request. All feedback
          is appreciated to help us improve our offering!
        </p>
        <div class="rate_button" aria-labelledby="rating-label">
          <button type="button">1</button>
          <button type="button">2</button>
          <button type="button">3</button>
          <button type="button">4</button>
          <button type="button">5</button>
        </div>
        <button type="button" id="submit_button">Submit</button>
      </section>
      <!-- Rating state end -->

      <!-- Thank you state start -->
      <section class="thank_you_state" aria-live="polite" hidden>
        <img
          src="./images/illustration-thank-you.svg"
          alt="Thank you illustration"
          class="card_img"
        />
        <div class="select_info">
          <span>You selected <span id="selected_value"></span> out of 5</span>
        </div>
        <h1 class="card_head">Thank you!</h1>
        <p class="card_details">
          We appreciate you taking the time to give a rating. If you ever need
          more support, don’t hesitate to get in touch!
        </p>
      </section>
      <!-- Thank you state end -->
    </div>
  </body>
</html>
